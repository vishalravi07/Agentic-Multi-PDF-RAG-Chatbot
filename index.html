<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Knowledge Assistant</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #2563eb;
    --brand-dark: #1d4ed8;
    --brand-soft: #eff4ff;
    --user-bubble: #2563eb;
    --ok: #15803d;
    --ok-soft: #ecfdf3;
    --err: #b91c1c;
    --err-soft: #fef2f2;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218;
      --panel: #181c25;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #2a303c;
      --brand: #3b82f6;
      --brand-dark: #60a5fa;
      --brand-soft: #1b2740;
      --user-bubble: #2563eb;
      --ok: #4ade80;
      --ok-soft: #12261b;
      --err: #f87171;
      --err-soft: #2a1717;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .55; }

  .app { display: flex; flex-direction: column; height: 100dvh; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 17px; }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; background: var(--brand);
    color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700;
  }
  .who { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; min-width: 0; }
  .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .btn-ghost {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 8px;
  }
  .btn-ghost:hover:not(:disabled) { background: var(--bg); }

  /* ---------- layout ---------- */
  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px 20px;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); min-height: 0;
  }
  aside { display: flex; flex-direction: column; overflow: hidden; }
  .side-section { padding: 16px; }
  .side-section + .side-section { border-top: 1px solid var(--line); }
  h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 650; }

  /* ---------- upload ---------- */
  .drop {
    border: 2px dashed var(--line); border-radius: 12px; padding: 18px 12px;
    text-align: center; color: var(--muted); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); color: var(--text); }
  .drop strong { color: var(--brand); }
  .drop small { display: block; margin-top: 4px; font-size: 12px; }
  .picked { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .picked li {
    display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px;
    border-radius: 6px; background: var(--bg); margin-bottom: 4px;
  }
  .picked li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picked li span:last-child { color: var(--muted); flex: none; }
  .picked li.bad { background: var(--err-soft); color: var(--err); }
  .btn {
    width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 10px;
    background: var(--brand); color: #fff; font-weight: 600;
  }
  .btn:hover:not(:disabled) { background: var(--brand-dark); }
  .results { margin-top: 10px; font-size: 13px; display: grid; gap: 4px; }
  .results div { padding: 6px 8px; border-radius: 6px; }
  .results .ok { background: var(--ok-soft); color: var(--ok); }
  .results .fail { background: var(--err-soft); color: var(--err); }

  /* ---------- documents ---------- */
  .docs-wrap { flex: 1; overflow-y: auto; min-height: 0; }
  .doc {
    display: flex; gap: 10px; align-items: flex-start; width: 100%;
    text-align: left; background: transparent; border: 1px solid transparent;
    border-radius: 10px; padding: 9px 10px; color: var(--text); margin-bottom: 4px;
  }
  .doc:hover { background: var(--bg); }
  .doc.active { background: var(--brand-soft); border-color: var(--brand); }
  .doc .ico { font-size: 18px; line-height: 1.3; }
  .doc .name { font-weight: 550; word-break: break-word; }
  .doc .meta { font-size: 12px; color: var(--muted); }
  .empty-note { color: var(--muted); font-size: 14px; padding: 6px 2px; }

  /* ---------- chat ---------- */
  .chat { display: flex; flex-direction: column; overflow: hidden; }
  .chat-head {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .scope { font-size: 14px; color: var(--muted); }
  .scope b { color: var(--text); font-weight: 600; }
  .scope-clear { font-size: 13px; padding: 4px 10px; }
  .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .welcome { margin: auto; text-align: center; color: var(--muted); max-width: 380px; }
  .welcome .big { font-size: 40px; }
  .welcome h3 { margin: 6px 0; color: var(--text); font-size: 18px; }
  .msg { max-width: 82%; }
  .msg.user { align-self: flex-end; }
  .msg.bot { align-self: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 14px; word-wrap: break-word; }
  .user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .bubble { background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bot .bubble.err { background: var(--err-soft); border-color: var(--err); color: var(--err); }
  .bot .bubble.weak { font-style: italic; color: var(--muted); }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child, .bubble .table-wrap:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble h4 { margin: 6px 0; font-size: 15px; }
  .bubble code { background: rgba(127,127,127,.18); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  /* Markdown tables rendered inside answers */
  .bubble .table-wrap {
    margin: 8px 0; overflow-x: auto; border: 1px solid var(--line);
    border-radius: 10px; background: var(--panel);
  }
  .bubble table { width: 100%; min-width: max-content; border-collapse: collapse; font-size: 13.5px; }
  .bubble th, .bubble td { padding: 7px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .bubble th {
    background: var(--brand-soft); color: var(--text);
    font-weight: 650; white-space: nowrap;
  }
  .bubble tbody tr:last-child td { border-bottom: 0; }
  .bubble tbody tr:nth-child(even) { background: rgba(127,127,127,.05); }
  .bubble tbody tr:hover { background: rgba(127,127,127,.09); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); margin-top: 6px; }
  details.sources { margin-top: 8px; font-size: 13px; }
  details.sources summary { cursor: pointer; color: var(--brand); font-weight: 550; }
  .src { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .src-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 550; }
  .src-head span:last-child { color: var(--muted); font-weight: 400; flex: none; }
  .src p { margin: 4px 0 0; color: var(--muted); white-space: pre-wrap; }
  /* AGENTIC CHANGE (5/6): styles for the agent badges and the step diary */
  .badge { font-size: 12px; margin-top: 6px; color: var(--muted); }
  .badge.ok { color: var(--ok); }
  details.trace { margin-top: 8px; font-size: 13px; }
  details.trace summary { cursor: pointer; color: var(--brand); font-weight: 550; }
  .step { margin-top: 4px; color: var(--muted); word-break: break-word; }
  .agent-toggle { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .composer { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 140px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; font: inherit;
    background: var(--panel); color: var(--text);
  }
  textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  .send { width: auto; margin: 0; padding: 10px 18px; }

  /* ---------- mobile ---------- */
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto minmax(420px, 1fr); overflow-y: auto; padding: 12px; }
    aside { overflow: visible; }
    .docs-wrap { overflow: visible; }
    .msg { max-width: 94%; }
    header { padding: 10px 12px; }
    .who span { max-width: 120px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">P</div> PDF Knowledge Assistant</div>
    <div class="who">
      <span id="userEmail"></span>
      <button class="btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main>
    <!-- ================= sidebar ================= -->
    <aside class="panel">
      <div class="side-section">
        <h2>Upload PDFs</h2>
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose PDF files">
          <strong>Click to choose</strong> or drag PDFs here
          <small>Up to 10 files, 25 MB each</small>
        </div>
        <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
        <ul class="picked" id="picked"></ul>
        <button class="btn" id="uploadBtn" disabled>Upload</button>
        <div class="results" id="results"></div>
      </div>

      <div class="side-section docs-wrap">
        <h2>My documents <span id="docCount"></span></h2>
        <div id="docs"></div>
      </div>
    </aside>

    <!-- ================= chat ================= -->
    <section class="panel chat">
      <div class="chat-head">
        <div class="scope">Searching: <b id="scopeLabel">all my documents</b></div>
        <button class="btn-ghost scope-clear" id="scopeClear" hidden>Search all documents</button>
        <!-- AGENTIC CHANGE (5/6): agent on/off switch -->
        <label class="agent-toggle" title="Plans, retries searches, checks its own answer. Slower, uses more model calls.">
          <input type="checkbox" id="agentMode" checked> Agent mode
        </label>
      </div>
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="big">📚</div>
          <h3>Ask your documents anything</h3>
          <div id="welcomeText">Upload one or more PDFs on the left, then ask a question here.</div>
        </div>
      </div>
      <form class="composer" id="composer">
        <textarea id="question" rows="1" maxlength="2000"
                  placeholder="Ask a question about your PDFs…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <button class="btn send" id="sendBtn" type="submit">Send</button>
      </form>
    </section>
  </main>
</div>

<script>
(() => {
  const MAX_FILES = 10;
  const MAX_FILE_MB = 25;

  const $ = (s) => document.querySelector(s);
  const state = { docs: [], selected: null, picked: [], asking: false, uploading: false };

  // ---------- helpers ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const fmtSize = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";

  function fmtDate(v) {
    const d = new Date(v);
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  // Minimal, safe markdown: text is escaped first, then simple formatting is added.
  // Supports headings, lists, bold/code, and GFM-style pipe tables.
  function renderMd(text) {
    const inline = (s) => s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");

    const splitRow = (line) => {
      let s = line.trim();
      if (s.startsWith("|")) s = s.slice(1);
      if (s.endsWith("|")) s = s.slice(0, -1);
      const cells = [];
      let current = "";
      for (let i = 0; i < s.length; i++) {
        if (s[i] === "\\" && s[i + 1] === "|") { current += "|"; i++; }
        else if (s[i] === "|") { cells.push(current.trim()); current = ""; }
        else current += s[i];
      }
      cells.push(current.trim());
      return cells;
    };
    const isTableRow = (line) => line.trim() !== "" && splitRow(line).length >= 2;
    const isSeparator = (line) => {
      if (!line.includes("|") && !line.includes("-")) return false;
      const cells = splitRow(line);
      return cells.length > 0 && cells.every((c) => /^:?-{2,}:?$/.test(c));
    };
    const alignOf = (cell) => {
      const c = cell.trim();
      const left = c.startsWith(":"), right = c.endsWith(":");
      return left && right ? "center" : right ? "right" : left ? "left" : "";
    };
    const renderTable = (header, aligns, rows) => {
      const cell = (tag, value, i) => {
        const align = aligns[i] ? ` style="text-align:${aligns[i]}"` : "";
        return `<${tag}${align}>${inline(value || "")}</${tag}>`;
      };
      const head = `<thead><tr>${header.map((h, i) => cell("th", h, i)).join("")}</tr></thead>`;
      const body = rows.length
        ? `<tbody>${rows.map((r) =>
            `<tr>${Array.from({ length: header.length }, (_, i) => cell("td", r[i] ?? "", i)).join("")}</tr>`
          ).join("")}</tbody>`
        : "";
      return `<div class="table-wrap"><table>${head}${body}</table></div>`;
    };

    const lines = esc(text).split("\n");
    let html = "", list = null;
    const close = () => { if (list) { html += `</${list}>`; list = null; } };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      let m;
      if (!line) { close(); continue; }

      // A header row immediately followed by |---|---| becomes a real HTML table.
      if (i + 1 < lines.length && isTableRow(line) && isSeparator(lines[i + 1])) {
        close();
        const header = splitRow(line);
        const aligns = splitRow(lines[i + 1]).map(alignOf);
        const rows = [];
        i += 2;
        while (i < lines.length && isTableRow(lines[i])) rows.push(splitRow(lines[i++]));
        i--;
        html += renderTable(header, aligns, rows);
      }
      else if ((m = line.match(/^#{1,6}\s+(.*)/))) { close(); html += `<h4>${inline(m[1])}</h4>`; }
      else if ((m = line.match(/^[-*•]\s+(.*)/))) {
        if (list !== "ul") { close(); html += "<ul>"; list = "ul"; }
        html += `<li>${inline(m[1])}</li>`;
      } else if ((m = line.match(/^\d+[.)]\s+(.*)/))) {
        if (list !== "ol") { close(); html += "<ol>"; list = "ol"; }
        html += `<li>${inline(m[1])}</li>`;
      } else { close(); html += `<p>${inline(line)}</p>`; }
    }
    close();
    return html;
  }

  async function api(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401) { location.href = "/login"; throw new Error("Please log in again."); }
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const d = data && data.detail;
      throw new Error(typeof d === "string" ? d : `Request failed (${res.status}).`);
    }
    return data;
  }

  // ---------- header ----------
  async function loadMe() {
    try {
      const me = await api("/api/me");
      $("#userEmail").textContent = me.email;
    } catch (_) {}
  }

  $("#logoutBtn").addEventListener("click", async () => {
    try { await fetch("/logout", { method: "POST" }); } catch (_) {}
    location.href = "/login";
  });

  // ---------- documents ----------
  async function loadDocs() {
    try {
      state.docs = await api("/api/documents");
    } catch (e) {
      $("#docs").innerHTML = `<div class="empty-note">Could not load documents: ${esc(e.message)}</div>`;
      return;
    }
    if (state.selected !== null && !state.docs.some((d) => d.id === state.selected)) state.selected = null;
    renderDocs();
    renderScope();
  }

  function renderDocs() {
    const box = $("#docs");
    $("#docCount").textContent = state.docs.length ? `(${state.docs.length})` : "";
    if (!state.docs.length) {
      box.innerHTML = `<div class="empty-note">No documents yet. Upload a PDF to get started.</div>`;
      return;
    }
    box.innerHTML = state.docs.map((d) => `
      <button class="doc ${d.id === state.selected ? "active" : ""}" data-id="${d.id}" title="Click to search only this PDF">
        <span class="ico">📄</span>
        <span>
          <div class="name">${esc(d.filename)}</div>
          <div class="meta">${d.total_pages} pages · ${d.num_chunks} chunks · ${esc(fmtDate(d.uploaded_at))}</div>
        </span>
      </button>`).join("");
  }

  $("#docs").addEventListener("click", (e) => {
    const btn = e.target.closest(".doc");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    state.selected = state.selected === id ? null : id;   // click again to un-select
    renderDocs();
    renderScope();
  });

  function renderScope() {
    const doc = state.docs.find((d) => d.id === state.selected);
    $("#scopeLabel").textContent = doc ? doc.filename : "all my documents";
    $("#scopeClear").hidden = !doc;

    const noDocs = state.docs.length === 0;
    $("#question").disabled = noDocs || state.asking;
    $("#sendBtn").disabled = noDocs || state.asking;
    $("#question").placeholder = noDocs
      ? "Upload a PDF first, then ask your question here."
      : "Ask a question about your PDFs…";
    const wt = $("#welcomeText");   // gone once the first message is sent
    if (wt) wt.textContent = noDocs
      ? "Upload one or more PDFs on the left, then ask a question here."
      : "Ask anything about your PDFs. Click a document on the left to search only that one.";
  }

  $("#scopeClear").addEventListener("click", () => {
    state.selected = null;
    renderDocs();
    renderScope();
  });

  // ---------- picking files ----------
  const drop = $("#drop"), fileInput = $("#fileInput");

  drop.addEventListener("click", () => fileInput.click());
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
  fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });

  function addFiles(list) {
    $("#results").innerHTML = "";
    for (const f of list) {
      const dup = state.picked.some((p) => p.file.name === f.name && p.file.size === f.size);
      if (dup) continue;
      let problem = "";
      if (!f.name.toLowerCase().endsWith(".pdf")) problem = "Not a PDF";
      else if (f.size > MAX_FILE_MB * 1048576) problem = `Over ${MAX_FILE_MB} MB`;
      state.picked.push({ file: f, problem });
    }
    renderPicked();
  }

  function renderPicked() {
    const valid = state.picked.filter((p) => !p.problem);
    $("#picked").innerHTML = state.picked.map((p) =>
      `<li class="${p.problem ? "bad" : ""}"><span>${esc(p.file.name)}</span><span>${p.problem || fmtSize(p.file.size)}</span></li>`
    ).join("");
    const tooMany = valid.length > MAX_FILES;
    $("#uploadBtn").disabled = state.uploading || valid.length === 0 || tooMany;
    $("#uploadBtn").textContent = state.uploading
      ? "Uploading… this can take a while"
      : tooMany ? `Too many files (max ${MAX_FILES})`
      : valid.length ? `Upload ${valid.length} PDF${valid.length > 1 ? "s" : ""}` : "Upload";
  }

  // ---------- uploading ----------
  $("#uploadBtn").addEventListener("click", async () => {
    const valid = state.picked.filter((p) => !p.problem);
    if (!valid.length || state.uploading) return;

    const form = new FormData();
    valid.forEach((p) => form.append("files", p.file));      // field name must be "files"

    state.uploading = true;
    renderPicked();
    $("#results").innerHTML = "";

    try {
      const data = await api("/api/upload", { method: "POST", body: form });
      $("#results").innerHTML = data.results.map((r) => r.success
        ? `<div class="ok">✓ ${esc(r.filename)} — ${r.total_pages} pages, ${r.num_chunks} chunks</div>`
        : `<div class="fail">✗ ${esc(r.filename)} — ${esc(r.error || "Failed")}</div>`
      ).join("");
      // keep only the files that failed, so they can be retried or removed
      const failedNames = new Set(data.results.filter((r) => !r.success).map((r) => r.filename));
      state.picked = state.picked.filter((p) => p.problem || failedNames.has(p.file.name));
      await loadDocs();
    } catch (e) {
      $("#results").innerHTML = `<div class="fail">${esc(e.message)}</div>`;
    } finally {
      state.uploading = false;
      renderPicked();
    }
  });

  // ---------- chat ----------
  const messages = $("#messages");

  function addMessage(role, innerHtml, extraClass = "") {
    const w = $("#welcome");
    if (w) w.remove();
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    el.innerHTML = `<div class="bubble ${extraClass}">${innerHtml}</div>`;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function sourcesHtml(sources) {
    if (!sources || !sources.length) return "";
    const items = sources.map((s) => {
      const pct = Math.round((s.similarity_score || 0) * 100);
      const text = String(s.chunk_text || "");
      const preview = text.length > 400 ? text.slice(0, 400) + "…" : text;
      return `<div class="src">
        <div class="src-head"><span>${esc(s.filename)} · page ${esc(s.page_number)}</span><span>${pct}% match</span></div>
        <p>${esc(preview)}</p>
      </div>`;
    }).join("");
    return `<details class="sources"><summary>Sources (${sources.length})</summary>${items}</details>`;
  }

  // AGENTIC CHANGE (5/6): badges + the "Agent steps" diary shown under an answer
  function agentHtml(res) {
    let out = "";
    if (res.widened) out += '<div class="badge">🔎 Nothing good in the selected PDF, so your other PDFs were searched too</div>';
    if (res.verified) out += '<div class="badge ok">✓ Self-check passed: every claim is backed by the document</div>';
    if (res.revised) out += '<div class="badge">✎ The agent found unsupported claims and rewrote the answer</div>';
    if (res.trace && res.trace.length) {
      const rows = res.trace.map((s, i) => {
        const { step, ...info } = s;
        return `<div class="step">${i + 1}. <b>${esc(step)}</b>: ${esc(JSON.stringify(info))}</div>`;
      }).join("");
      out += `<details class="trace"><summary>Agent steps (${res.trace.length})</summary>${rows}</details>`;
    }
    return out;
  }

  async function ask(question) {
    state.asking = true;
    renderScope();

    addMessage("user", esc(question));
    const pending = addMessage("bot", `<span class="typing"><i></i><i></i><i></i></span>` +
      ($("#agentMode").checked ? `<div class="badge">The agent is working (this can take a while)…</div>` : ""));

    try {
      const res = await api("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // AGENTIC CHANGE (5/6): send the chosen mode
        body: JSON.stringify({ question, document_id: state.selected, top_k: 5,
                               mode: $("#agentMode").checked ? "agent" : "simple" }),
      });
      const ok = res.retrieval_ok !== false;
      pending.innerHTML = `<div class="bubble ${ok ? "" : "weak"}">
          ${renderMd(res.answer || "")}
          ${res.cached ? '<span class="tag">⚡ cached answer</span>' : ""}
          ${ok ? sourcesHtml(res.sources) : ""}
          ${agentHtml(res)}
        </div>`;
    } catch (e) {
      pending.innerHTML = `<div class="bubble err">${esc(e.message)}</div>`;
    } finally {
      state.asking = false;
      renderScope();
      messages.scrollTop = messages.scrollHeight;
      $("#question").focus();
    }
  }

  const q = $("#question");
  q.addEventListener("input", () => {
    q.style.height = "auto";
    q.style.height = Math.min(q.scrollHeight, 140) + "px";
  });
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); }
  });
  $("#composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = q.value.trim();
    if (!text || state.asking || !state.docs.length) return;
    q.value = "";
    q.style.height = "auto";
    ask(text);
  });

  // ---------- start ----------
  loadMe();
  loadDocs();
  renderPicked();
})();
</script>
</body>
</html>
